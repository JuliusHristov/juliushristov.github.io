name: Update research roadmap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-roadmap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update roadmap
        run: python extend_roadmap_ch18.py

      - name: Commit updated roadmap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roadmap.html
          if ! git diff --cached --quiet; then
            git commit -m "Extend research roadmap with Chapter 18"
            git push
          fi
